name: Pytest

on:
  push:
    branches: ["tony/dummy-pr"]
  pull_request:
    branches: ["main", "tony/dummy-pr"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/pysrc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config

      - name: Poetry & Conan via pipx
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry
          pipx install conan
          conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.*') }}-gcc13-cpp20-Release
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Install Python Deps
        run: poetry install --no-interaction --no-root --with dev

      - name: Conan Install (Release, C++20, Build Missing)
        run: |
          conan install . -of build \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            --build=missing \
            -g CMakeDeps -g CMakeToolchain

      - name: Locate Conan CMake Files
        id: conan_paths
        run: |
          set -e
          TOOLCHAIN="$(find "$GITHUB_WORKSPACE/build" -name conan_toolchain.cmake -print -quit)"
          GENPFX="$(dirname "$TOOLCHAIN")"
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "GENPFX=$GENPFX"
          test -f "$TOOLCHAIN"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "genpfx=$GENPFX" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Use Conan Toolchain)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.conan_paths.outputs.toolchain }}" \
            -DCMAKE_PREFIX_PATH="${{ steps.conan_paths.outputs.genpfx }}"

      - name: Build pybind11 Module
        run: cmake --build build -j --target intern

      - name: Run Pytest
        run: poetry run pytest -q src/pysrc/test
