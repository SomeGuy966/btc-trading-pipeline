name: C++ Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  cpptest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Poetry & Conan
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry
          pipx install conan
          conan profile detect || true

      - name: Build
        run: |
          mkdir -p build
          make build

      - name: Run C++ tests
        run: |
          cd build
          ./cpp_tests
